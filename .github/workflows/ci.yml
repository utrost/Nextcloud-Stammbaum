name: Native app checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run format:check
      - run: python3 scripts/check-docs.py
      - name: PHP 8.3 syntax
        run: docker run --rm -v "$PWD:/app:ro" php:8.3-cli sh -c 'find /app/lib /app/appinfo /app/templates -name "*.php" -print0 | xargs -0 -n1 php -l'
      - run: npm run package
      - name: Create disposable Nextcloud and MariaDB
        run: python3 scripts/test-instance.py
      - name: Pinned Nextcloud Tasks and fictional task calendar
        run: python3 scripts/install-test-tasks.py
      - name: Pinned Nextcloud Contacts and fictional address book
        run: python3 scripts/install-test-contacts.py
      - name: Optional PDF preview runtime
        run: docker exec -u root stammbaum-iteration-nc sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends poppler-utils'
      - run: python3 scripts/deploy-test.py
      - name: PHP value tests with Nextcloud extensions
        run: docker run --rm -v "$PWD:/app:ro" nextcloud:34.0.4-apache php /app/tests/unit/values.php
      - name: Private preview cache limits and authority races
        run: docker run --rm --network none -v "$PWD:/app:ro" nextcloud:34.0.4-apache php /app/tests/unit/preview-cache.php
      - name: PDF renderer unavailable fallback
        run: docker run --rm --network none -v "$PWD:/app:ro" nextcloud:34.0.4-apache php /app/tests/unit/pdf-preview-unavailable.php
      - name: GEDCOM export projection tests
        run: docker run --rm --network none -v "$PWD:/app:ro" nextcloud:34.0.4-apache php /app/tests/unit/gedcom-export.php
      - name: GEDCOM parser and preservation tests
        run: docker run --rm -v "$PWD:/app:ro" nextcloud:34.0.4-apache php /app/tests/unit/gedcom.php
      - name: Research task iCalendar serialization
        run: docker run --rm --network none -v "$PWD:/app:ro" nextcloud:34.0.4-apache php -d zend.assertions=1 -d assert.exception=1 /app/tests/unit/research-tasks.php
      - name: Native screenshot font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-core
      - run: npx playwright test
      - name: Optional Contacts absence and core genealogy
        run: node scripts/check-contacts-optional.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stammbaum-browser-results
          path: |
            test-results/results.json
            test-results/*.png
            test-results/**/test-failed-*.png
            test-results/**/*-actual.png
            test-results/**/*-diff.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: stammbaum-runtime
          path: |
            build/stammbaum-*.tar.gz
            build/stammbaum-*.tar.gz.sha256
          if-no-files-found: error
